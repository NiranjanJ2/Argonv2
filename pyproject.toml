[project]
name = "argon"
version = "2.0.0"
description = "A personal assistant that decides, rather than a state machine that phrases."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "flask>=3.0",
    "discord.py>=2.3",
    "cryptography>=42.0",
    "httpx[http2]>=0.27",
]

[project.scripts]
argon = "argon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argon"]
